# pnpm 11 reads settings from here (the package.json "pnpm" field is no longer read).
allowBuilds:
  # migrated from the old onlyBuiltDependencies in package.json
  "@scarf/scarf": false
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAge: 0

# Transitive-dependency security pins (same idiom as reddoor-maintenance —
# pnpm 11 reads overrides HERE, not package.json). Cleared 2026-07-14:
#   - qs >=6.11.1 <6.15.2: stringify DoS on null comma-format entries (GHSA-q8mj-m7cp-5q26)
#   - uuid <11.1.1: missing buffer bounds check in v3/v5/v6 (GHSA-w5hq-g745-h8pq)
#   - cookie <0.7.0: out-of-bounds chars in name/path/domain (GHSA-pxg6-pf52-xh8x) — the
#     one runtime-scope alert; the others are dev/CI-only
# Cleared 2026-07-26:
#   - sharp <0.35.0: inherited libvips CVEs (GHSA-f88m-g3jw-g9cj); transitive pin via
#     @zerodevx/svelte-img > vite-imagetools > imagetools-core@6 (^0.33.1) — runtime scope
# Cleared 2026-08-07 (the fleet security audit fails onboarding on these):
#   - nanoid <3.3.17: custom generators loop indefinitely when size is 0
#     (GHSA-2v37-7h3g-55p8) — HIGH, and a high vuln lands in the daily digest's
#     "Needs attention" section, so it would greet the site on day one.
#   - postcss <=8.5.22: incomplete fix of GHSA-6g55-p6wh-862q, attacker-controlled
#     sourceMappingURL (GHSA-fxqj-rqcc-2cmp)
#   Both reach us ONLY through eslint-plugin-svelte (pulled in by
#   @reddoorla/maintenance, which sits in `dependencies`, which is why --prod
#   sees them at all). There is no direct dependency to bump, so an override is
#   the only lever until eslint-plugin-svelte moves.
overrides:
  qs@<6.15.2: ">=6.15.2 <7"
  uuid@<11.1.1: ">=11.1.1"
  cookie@<0.7.0: ">=0.7.0 <1"
  sharp@<0.35.0: ^0.35.3
  nanoid@<3.3.17: ">=3.3.17"
  postcss@<8.5.23: ">=8.5.23"
