<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Live's own favicon + webclip (Webflow logo=blue.ico / logo=blue.png),
         not the starter placeholder. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <meta name="viewport" content="width=device-width" />
    <link rel="preconnect" href="https://use.typekit.net" />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/tao4byj.css" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- display:contents wrapper per SvelteKit's recommendation: placing the app
         directly inside <body> can break when browser extensions inject nodes. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
