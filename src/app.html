<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The webclip is live's own (Webflow logo=blue.png). The favicon.ico is
         NOT live's: live's ico bakes opaque white corners around the circle
         logo (MarkUp thread 784b9a3f, pin #13), so ours is regenerated from
         the transparent apple-touch-icon.png (32+16 PNG-in-ICO entries,
         real alpha). Not the starter placeholder either — static/favicon.png
         is that placeholder (white logo) and is deliberately unlinked. -->
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.ico"
      sizes="32x32 16x16"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <meta name="viewport" content="width=device-width" />
    <!-- Search Console ownership token (Site Verification API, META method,
         issued to Reddoor's Google account; never write an email address in
         this file, since every scraper reads it). Static on purpose: the verifier
         fetches served HTML without running JS, so the runtime-injected GA
         tag can never satisfy it. Removing this line un-verifies the
         property's owner over time. -->
    <meta
      name="google-site-verification"
      content="YuoEeFMzztDea346sXvNqeCm0fWj1NJT5eFqaqiOVp0"
    />
    <!-- Typekit is two render-blocking hops: tao4byj.css, then the p.css it
         @imports (Adobe's licence pageview counter, a few bytes). Measured on
         the 2026-11-09 Lighthouse runs, p.css could not start until tao4byj.css
         landed and held first paint ~330 ms past the site's own CSS. The
         preload below fetches it in parallel; it MUST stay byte-identical to
         the @import URL in https://use.typekit.net/tao4byj.css (re-read it if
         the kit is republished), or it is a wasted request and the chain is
         back. Fonts are fetched with CORS and the stylesheets without, and a
         browser keeps those on separate connections: hence a crossorigin
         preconnect for use.typekit.net's fonts (its stylesheet, right below,
         is found by the preload scanner anyway), and one without for
         p.typekit.net, which serves only the no-CORS p.css. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" />
    <link rel="stylesheet" href="https://use.typekit.net/tao4byj.css" />
    <link
      rel="preload"
      as="style"
      href="https://p.typekit.net/p.css?s=1&k=tao4byj&ht=tk&f=2005.2006.2007.2008.2026.2027.2028.2029.2030.2031.2032.2033.2036.2037.52856.52863.52864.52866&a=25763742&app=typekit&e=css"
    />
    <!-- The no-JS half of the scroll-reveal's first-paint hidden state (app.css,
         `[data-reveal]`). With scripting off this style applies and every
         revealed element paints normally; with scripting on the browser ignores
         the whole element, so the hidden state stands and animateIn owns it.
         Content can therefore never be stranded at opacity 0 by a browser that
         was never going to run the reveal — same guarantee a curl of the SSR
         HTML gives a crawler.
         WHY A STYLE AND NOT AN INLINE `classList.add("js")` SCRIPT: measured on
         the real build, an unhashed inline script in this template is governed
         by the site's own CSP (sveltekit.config.js `csp`, script-src with no
         'unsafe-inline'). On prerendered routes it survives only because the
         policy ships as a <meta> tag emitted after it; on server-rendered
         routes the policy is an HTTP header carrying a nonce, and the script is
         silently dropped — `documentElement.className` came back "" on
         /contact-us and "js" on /. A guard that is live on some routes and dead
         on others is worse than no guard. style-src already allows inline
         styles (Typekit needs it), so this half works identically everywhere
         and needs no CSP hash to maintain. -->
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- display:contents wrapper per SvelteKit's recommendation: placing the app
         directly inside <body> can break when browser extensions inject nodes. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
